apiVersion: apps/v1
kind: Deployment
metadata: {name: studytrack-frontend, labels: {app: studytrack-frontend}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: studytrack-frontend}}
  template:
    metadata: {labels: {app: studytrack-frontend}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        ports: [{containerPort: 8080}]
        env: [{name: BACKEND_HOST, value: "studytrack-backend:8000"}]
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}


